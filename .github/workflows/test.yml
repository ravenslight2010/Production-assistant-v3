name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check server syntax
        run: pnpm check:server

      - name: Check API generated
        run: pnpm check:api-generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build for browser tests
        run: pnpm build

      - name: Browser tests
        run: pnpm test:browser

      - name: No AI check
        run: pnpm check:no-ai

      - name: Research check
        run: pnpm check:research

      - name: Security audit
        run: pnpm audit:prod
        continue-on-error: true

