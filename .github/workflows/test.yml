name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'

      - uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check server syntax
        run: pnpm check:server

      - name: Check API generated
        run: pnpm check:api-generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Build for browser tests
        run: pnpm build

      - name: Browser tests (Chromium)
        run: pnpm test:browser

      - name: Browser tests (WebKit)
        run: BROWSER=webkit BROWSER_ENGINE=webkit pnpm test:browser

      - name: Browser tests (Firefox)
        run: BROWSER=firefox BROWSER_ENGINE=firefox pnpm test:browser

      - name: No AI check
        run: pnpm check:no-ai

      - name: Research check
        run: pnpm check:research

      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib

      - name: Database tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          PG_BIN=$(dirname $(find /usr/lib/postgresql -name initdb | head -1))
          if [ -z "$PG_BIN" ] || [ ! -x "$PG_BIN/initdb" ]; then
            echo "initdb not found"
            find /usr -name initdb 2>/dev/null || true
            exit 1
          fi
          export PATH="$PG_BIN:$PATH"
          which initdb
          pnpm test:db

      - name: Security audit
        run: pnpm audit:prod
        continue-on-error: true

