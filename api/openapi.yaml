    SourceRecordCitation:
      type: object
      additionalProperties: false
      required: [code, source, sourceDetails]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        source:
          $ref: "#/components/schemas/SourceCitation"
        sourceDetails:
          type: [object, "null"]
          additionalProperties: true
    SourceWorkbookPreviewRequest:
