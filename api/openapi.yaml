      type: object
      additionalProperties: false
      required: [code, name, data]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        data:
          type: object
          description: Family-specific allowlisted values; unknown values are rejected.
