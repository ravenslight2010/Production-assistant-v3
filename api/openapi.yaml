                    format: date
                  brand:
                    type: string
                  flavor:
                    type: string
                  targetCases:
                    type: [integer, "null"]
                  notes:
                    type: string
                  sourceCells:
                    type: object
                  sourceRow:
                    type: integer
                  importRunId:
                    type: string
                    format: uuid
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ScheduleWorkbookIssue"
            skipped:
              type: array
              items:
                $ref: "#/components/schemas/ScheduleWorkbookSkipped"
            multiDay:
              type: boolean
            fileName:
              type: string
    ScheduleWorkbookIssue:
      type: object
      required: [rowNumber, sheet, message]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        sheet:
          type: string
          maxLength: 31
        date:
          type: string
          format: date
        message:
          type: string
          maxLength: 300
    ScheduleWorkbookSkipped:
      type: object
      required: [rowNumber, sheet, reason]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        sheet:
          type: string
          maxLength: 31
        date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 300
    QcTargetKey:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$"
      maxLength: 120
    QcDecimal:
      type: string
      pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,6})?$"
      description: Non-negative decimal represented as a string to preserve precision.
    QcMeasurementValue:
      type: string
      pattern: "^(0|[1-9][0-9]{0,5})(\\.[0-9]{1,6})?$"
      description: Positive decimal observation represented as a string.
    QcWeightUnit:
      type: string
      enum: [g, kg, oz, lb]
    QcNotEvaluatedReason:
      type: string
      enum: [no-reviewed-target, target-unavailable, target-kind-mismatch, target-inactive, unit-mismatch]
    QcTarget:
      type: object
      additionalProperties: false
      required: [targetKey, kind, unit, minimum, maximum, active, revision, updatedBy, updatedAt]
      properties:
        targetKey:
          $ref: "#/components/schemas/QcTargetKey"
        kind:
          type: string
          enum: [weight, brix]
        unit:
          type: string
          enum: [g, kg, oz, lb, brix]
        minimum:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,6})?$"
        maximum:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,6})?$"
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
    QcTargets:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/QcTarget"
    QcLotInput:
      type: object
      additionalProperties: false
      required: [productCode, lotNumber, notes]
      properties:
        productCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
