openapi: 3.1.0
info:
  title: V3 Run Control API
  version: 0.1.0
  description: >
    Facility-scoped run control. The host must authenticate staff, enforce
    permissions, and validate same-origin/CSRF protection before mutations.
servers:
  - url: /
security:
  - v3Session: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Check API and V3 database availability
      security: []
      responses:
        "200":
          description: API and station worker can serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database or station worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with a V3 staff account
      description: >
        Creates a fresh V3-only session. The server sets an HttpOnly session
        cookie and a separate readable CSRF cookie; credentials and tokens are
        never returned in the response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignIn"
      responses:
        "200":
          description: Sign-in accepted; session and CSRF cookies are set
          headers:
            Set-Cookie:
              description: Separate v3_session and v3_csrf cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/session:
    get:
      operationId: getSession
      summary: Read the current V3 staff session
      responses:
        "200":
          description: Public staff identity and session expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/bootstrap-status:
    get:
      operationId: getFirstManagerSetupStatus
      summary: Check whether guarded V3 setup is available
      description: >
        Setup is available only while a V3 bootstrap secret is configured, no
        staff account exists, and the durable one-time bootstrap marker is
        unset. The response never contains the secret or any account credential.
      security: []
      responses:
        "200":
          description: One-time first-manager setup status
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/bootstrap:
    post:
      operationId: bootstrapFirstManager
      summary: Create the first V3 manager once
      description: >
        Requires the server-configured one-time V3 bootstrap code and an empty
        V3 staff-account table. The server sets session and CSRF cookies;
        passwords, bootstrap codes, and session tokens are not returned in the
        response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstManagerBootstrap"
      responses:
        "201":
          description: First manager created and signed in
          headers:
            Set-Cookie:
              description: Separate V3 session and CSRF cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current V3 staff session
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked or already absent; V3 auth cookies cleared
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/staff:
    get:
      operationId: listStaffAccounts
      summary: List V3 staff accounts and assignable roles
      responses:
        "200":
          description: Bounded staff directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaffAccount
      summary: Create a V3 staff account
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccountCreate"
      responses:
        "201":
          description: Staff account created; no credential is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "200":
          description: Exact staff-creation replay confirmed; no credential is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/staff/{staffId}:
    patch:
      operationId: updateStaffAccount
      summary: Disable a staff account or change its role
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccountUpdate"
      responses:
        "200":
          description: Staff account updated; affected sessions are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v3/auth/staff/{staffId}/revoke-sessions:
    post:
      operationId: revokeStaffSessions
      summary: Revoke all active sessions for a staff account
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRevisionCommand"
      responses:
        "200":
          description: Sessions revoked, or an exact replay confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionRevocation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/invitations/accept:
    post:
      operationId: acceptStaffInvitation
      summary: Accept a single-use staff invitation
      description: >
        Invitation secrets are accepted only in the JSON body. A replay confirms
        that the account exists and requires sign-in; it never recreates a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationAccept"
      responses:
        "201":
          description: Invitation accepted and staff account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationAcceptance"
        "200":
          description: Exact acceptance replay confirmed; sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationAcceptance"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/invitations:
    get:
      operationId: listStaffInvitations
      summary: List staff invitations visible to the manager's capabilities
      responses:
        "200":
          description: Bounded invitation list without plaintext secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaffInvitation
      summary: Create a single-use staff invitation
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationCreate"
      responses:
        "201":
          description: Invitation created; plaintext secret is returned only now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationSecret"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/invitations/{invitationId}/revoke:
    post:
      operationId: revokeStaffInvitation
      summary: Revoke an active staff invitation
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRevisionCommand"
      responses:
        "200":
          description: Invitation revoked, or an exact replay confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationMutation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/password-reset-requests:
    get:
      operationId: listPasswordResetRequests
      summary: List password-reset requests visible to the approver
      responses:
        "200":
          description: Bounded approval queue and pending count without reset codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetQueue"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: requestPasswordReset
      summary: Request manager-approved password recovery
      description: The response is identical whether or not the username exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestCreate"
      responses:
        "202":
          description: Recovery request accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/password-reset-requests/{requestId}/approve:
    post:
      operationId: approvePasswordReset
      summary: Approve recovery and issue a single-use reset code
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/PasswordResetId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRevisionCommand"
      responses:
        "200":
          description: Reset approved; plaintext code is returned only now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetSecret"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/password-reset-requests/{requestId}/decline:
    post:
      operationId: declinePasswordReset
      summary: Decline a pending password-reset request
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/PasswordResetId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRevisionCommand"
      responses:
        "200":
          description: Reset declined without revoking sessions, or an exact replay confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetMutation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/password-reset-requests/{requestId}/reissue:
    post:
      operationId: reissuePasswordReset
      summary: Invalidate and replace an approved reset code
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/PasswordResetId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRevisionCommand"
      responses:
        "200":
          description: Replacement reset code issued; plaintext code is returned only now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetSecret"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/password-reset:
    post:
      operationId: completePasswordReset
      summary: Complete recovery with an approved single-use code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetComplete"
      responses:
        "200":
          description: Password replaced and prior sessions revoked; sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetCompleted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/auth/change-password:
    post:
      operationId: changeOwnPassword
      summary: Change the signed-in account's password
      description: Prior sessions are revoked and a fresh session is returned.
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "200":
          description: Password changed and fresh session/CSRF cookies set
          headers:
            Set-Cookie:
              description: Separate replacement v3_session and v3_csrf cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v3/runs:
    get:
      operationId: listRuns
      summary: List runs for the authenticated facility
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Facility-scoped run list
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRun
      summary: Create a planned run
      security:
        - v3Session: []
          v3CsrfCookie: []
      description: >
        New runs require an active imported product. requestId is an idempotency
        key. Repeating the same request returns the original run; reusing the
        key for different details returns 409.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, productionDate, setupSnapshot]
              properties:
                requestId:
                  type: string
                  format: uuid
                productionDate:
                  type: string
                  format: date
                  description: Explicit immutable production date; the client initially defaults it to the current America/Chicago date.
                setupSnapshot:
                  $ref: "#/components/schemas/RunCreateSetup"
      responses:
        "201":
          description: New planned run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "200":
