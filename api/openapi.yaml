          $ref: "#/components/schemas/QcMeasurementValue"
        unit:
          $ref: "#/components/schemas/QcWeightUnit"
        targetKey:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$"
          maxLength: 120
        notes:
          type: string
          maxLength: 1000
    QcBrixCheckInput:
      type: object
      additionalProperties: false
      required: [phase, value, unit, targetKey, notes]
      properties:
        phase:
          type: "null"
        value:
          $ref: "#/components/schemas/QcMeasurementValue"
        unit:
          const: brix
        targetKey:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$"
          maxLength: 120
        notes:
          type: string
          maxLength: 1000
    QcLotRequest:
      type: object
      additionalProperties: false
      required: [requestId, runId, details]
      properties:
        requestId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        details:
          $ref: "#/components/schemas/QcLotInput"
    QcWeightCheckRequest:
      type: object
      additionalProperties: false
      required: [requestId, runId, details]
      properties:
        requestId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        details:
          $ref: "#/components/schemas/QcWeightCheckInput"
    QcBrixCheckRequest:
      type: object
      additionalProperties: false
      required: [requestId, runId, details]
      properties:
        requestId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        details:
          $ref: "#/components/schemas/QcBrixCheckInput"
    QcTargetInput:
      type: object
      additionalProperties: false
      required: [kind, unit, minimum, maximum, active]
      properties:
        kind:
          type: string
          enum: [weight, brix]
        unit:
          type: string
          enum: [g, kg, oz, lb, brix]
        minimum:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,6})?$"
        maximum:
          type: [string, "null"]
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,6})?$"
        active:
          type: boolean
    QcTargetSaveRequest:
      type: object
      additionalProperties: false
      required: [requestId, targetKey, expectedRevision, details]
      properties:
        requestId:
          type: string
          format: uuid
        targetKey:
          $ref: "#/components/schemas/QcTargetKey"
        expectedRevision:
          type: integer
          minimum: 0
        details:
          $ref: "#/components/schemas/QcTargetInput"
    QcRecordBase:
      type: object
      required: [recordId, sequence, runId, actorId, relatedRecordId, recordedAt]
      properties:
        recordId:
          type: string
          format: uuid
        sequence:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Immutable facility QC sequence, serialized as a decimal string.
        runId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        relatedRecordId:
          type: "null"
        recordedAt:
          type: string
          format: date-time
    QcEvaluation:
