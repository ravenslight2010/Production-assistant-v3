          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v3/qc/targets:
    get:
      operationId: getQcTargets
      summary: List current reviewed weight and Brix targets
      responses:
        "200":
          description: Facility-scoped current targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcTargets"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
    post:
      operationId: saveQcTarget
      summary: Create or revise a reviewed target with a revision fence
      description: QC manager only. Existing observations retain their original target snapshot.
      security:
        - v3Session: []
          v3CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QcTargetSaveRequest"
      responses:
        "200":
          description: Target accepted or confirmed by exact retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcTargetSaveAccepted"
        "409":
          description: Canonical current targets for stale-revision or request-ID review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcTargetSaveResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    v3Session:
      type: apiKey
      in: cookie
      name: v3_session
    v3CsrfCookie:
      type: apiKey
      in: cookie
      name: v3_csrf
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      in: path
      name: importId
      required: true
      schema:
        type: string
        format: uuid
    CountId:
      in: path
      name: countId
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
    PasswordResetId:
      in: path
      name: requestId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
        stationWorker:
          type: object
          required:
            - status
            - lastCycleAt
            - lastSuccessAt
            - consecutiveFailures
            - lastErrorName
            - processedLastCycle
          properties:
            status:
              type: string
              enum: [active, standby]
            lastCycleAt:
              type: [string, "null"]
              format: date-time
            lastSuccessAt:
              type: [string, "null"]
              format: date-time
            consecutiveFailures:
              type: integer
              minimum: 0
            lastErrorName:
              type: [string, "null"]
              pattern: "^[A-Za-z][A-Za-z0-9_]{0,79}$"
            processedLastCycle:
              type: integer
              minimum: 0
    AuthSignIn:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 1
          maxLength: 128
    FirstManagerBootstrap:
      type: object
      additionalProperties: false
      required: [bootstrapCode, username, password]
      properties:
        bootstrapCode:
          type: string
          minLength: 32
          maxLength: 256
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 6
          maxLength: 128
    StaffAccountCreate:
      type: object
      additionalProperties: false
      required: [username, password, roleName, requestId]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 6
          maxLength: 128
        roleName:
          type: string
          minLength: 1
          maxLength: 80
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    StaffAccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 3
      required: [expectedRevision, requestId]
      properties:
        disabled:
          type: boolean
        roleName:
          type: string
          minLength: 1
          maxLength: 80
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    AccountRequestId:
      type: string
      minLength: 1
      maxLength: 200
    AccountRevisionCommand:
      type: object
      additionalProperties: false
      required: [expectedRevision, requestId]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    StaffInvitationCreate:
      type: object
      additionalProperties: false
      required: [roleName, requestId]
      properties:
        roleName:
          type: string
          minLength: 1
          maxLength: 80
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    StaffInvitationAccept:
      type: object
      additionalProperties: false
      required: [secret, username, password, requestId]
      properties:
        secret:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 6
          maxLength: 128
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    PasswordResetRequestCreate:
      type: object
      additionalProperties: false
      required: [username, requestId]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    PasswordResetComplete:
      type: object
      additionalProperties: false
      required: [username, code, password, requestId]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        code:
          type: string
          maxLength: 64
          description: Eight-character recovery code; case, whitespace, and dashes are normalized.
        password:
          type: string
          minLength: 6
          maxLength: 128
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword, requestId]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 6
          maxLength: 128
        requestId:
          $ref: "#/components/schemas/AccountRequestId"
    StaffDirectory:
      type: object
      required: [staff, roles]
      properties:
        staff:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/StaffAccount"
        roles:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StaffRole"
        outcome:
          type: string
          enum: [updated, unchanged]
    StaffAccount:
      type: object
      required: [userId, username, role, disabled, createdAt, revision]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    StaffRole:
      type: object
      required: [name, capabilities]
      properties:
        name:
          type: string
        capabilities:
          type: array
          items:
            type: string
    StaffInvitation:
      type: object
      required: [invitationId, roleName, status, createdAt, expiresAt, revision]
      properties:
        invitationId:
          type: string
          format: uuid
        roleName:
          type: string
        status:
          type: string
          enum: [active, consumed, revoked, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    StaffInvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/StaffInvitation"
    StaffInvitationSecret:
      type: object
      required: [invitation, secret]
      properties:
        invitation:
          $ref: "#/components/schemas/StaffInvitation"
        secret:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    StaffInvitationMutation:
      type: object
      required: [invitation, outcome]
      properties:
        invitation:
          $ref: "#/components/schemas/StaffInvitation"
        outcome:
          const: revoked
        replayed:
          type: boolean
    StaffInvitationAcceptance:
      type: object
      required: [outcome, staff]
      properties:
        outcome:
          type: string
          enum: [accepted, accepted_sign_in_required]
        staff:
          $ref: "#/components/schemas/StaffAccount"
    StaffSessionRevocation:
      type: object
      required: [outcome, staff]
      properties:
        outcome:
          const: revoked
        staff:
          $ref: "#/components/schemas/StaffAccount"
        replayed:
          type: boolean
    PasswordResetRequest:
      type: object
      required: [requestId, staffId, username, role, status, requestedAt, expiresAt, revision, approvedAt, codeExpiresAt]
      properties:
        requestId:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [pending, approved, declined, used, superseded, invalidated, expired]
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        approvedAt:
          type: [string, "null"]
          format: date-time
        codeExpiresAt:
          type: [string, "null"]
          format: date-time
    PasswordResetQueue:
      type: object
      required: [requests, pendingCount]
      properties:
        requests:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PasswordResetRequest"
        pendingCount:
          type: integer
          minimum: 0
          maximum: 200
    PasswordResetRequestAccepted:
      type: object
      required: [outcome]
      properties:
        outcome:
          const: accepted
    PasswordResetSecret:
      type: object
      required: [request, code]
      properties:
        request:
          $ref: "#/components/schemas/PasswordResetRequest"
        code:
          type: string
          pattern: "^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$"
    PasswordResetMutation:
      type: object
      required: [request, outcome]
      properties:
        request:
          $ref: "#/components/schemas/PasswordResetRequest"
        outcome:
          const: declined
        replayed:
          type: boolean
    PasswordResetCompleted:
      type: object
      required: [outcome]
      properties:
        outcome:
          const: completed
    AuthSession:
      type: object
      required: [staff, expiresAt]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        expiresAt:
          type: string
          format: date-time
    Staff:
      type: object
      required: [userId, username, role, capabilities]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        capabilities:
          type: array
          items:
            type: string
    RunSetup:
      type: object
      additionalProperties: false
      required: [label, targetCases]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        targetCases:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        productCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
          description: Stable link to the active V3 product selected when the run is created.
        productionSetupCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
          description: Stable link to the compatible imported production setup.
        productionPlan:
          $ref: "#/components/schemas/ProductionPlanSnapshot"
        dieSetup:
          $ref: "#/components/schemas/RunDieSetupSnapshot"
    RunCreateSetup:
      type: object
      additionalProperties: false
      required: [label, targetCases, productCode, productionSetupCode]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        targetCases:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        productCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        productionSetupCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        dieSetup:
          $ref: "#/components/schemas/RunDieSetupInput"
    RunDieSetupInput:
      type: object
      additionalProperties: false
      required: [dieTypeCode, expectedRevision, lineSettings]
      properties:
        dieTypeCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        lineSettings:
          $ref: "#/components/schemas/DieLineSettings"
    RunDieSetupSnapshot:
      type: object
      additionalProperties: false
      required: [dieTypeCode, dieTypeName, defaultStatus, defaultRevision, lineSettings]
      properties:
        dieTypeCode:
          type: string
        dieTypeName:
          type: string
        defaultStatus:
          type: string
          enum: [active, disabled, unreviewed]
        defaultRevision:
          type: integer
          minimum: 0
        lineSettings:
          $ref: "#/components/schemas/DieLineSettings"
    DieLineSettings:
      type: object
      additionalProperties: false
      required: [crustsPerCycle, cycleSpeed, speedAdjustment, freezerTime, casesPerLayer, preTunnelMin, postTunnelMin, pressOvenMin, frontlineMin]
      properties:
        crustsPerCycle:
          type: [number, "null"]
          minimum: 0
        cycleSpeed:
          type: [number, "null"]
          minimum: 0
        speedAdjustment:
          type: [number, "null"]
          minimum: 0
        freezerTime:
          type: [number, "null"]
          minimum: 0
        casesPerLayer:
          type: [number, "null"]
          minimum: 0
        preTunnelMin:
          type: [number, "null"]
          minimum: 0
        postTunnelMin:
          type: [number, "null"]
          minimum: 0
        pressOvenMin:
          type: [number, "null"]
          minimum: 0
        frontlineMin:
          type: [number, "null"]
          minimum: 0
    ReviewedDieLineSettings:
      type: object
      additionalProperties: false
      required: [crustsPerCycle, cycleSpeed, speedAdjustment, freezerTime, casesPerLayer, preTunnelMin, postTunnelMin, pressOvenMin, frontlineMin]
      properties:
        crustsPerCycle:
          type: number
          minimum: 0
        cycleSpeed:
          type: number
          minimum: 0
        speedAdjustment:
          type: number
          minimum: 0
        freezerTime:
          type: number
          minimum: 0
        casesPerLayer:
          type: number
          minimum: 0
        preTunnelMin:
          type: [number, "null"]
          minimum: 0
        postTunnelMin:
          type: [number, "null"]
          minimum: 0
        pressOvenMin:
          type: [number, "null"]
          minimum: 0
        frontlineMin:
          type: [number, "null"]
          minimum: 0
    ReviewedDieDefault:
      type: object
      required: [code, name, status, revision, defaults, suggestedDefaults]
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled, unreviewed]
        revision:
          type: integer
          minimum: 0
        defaults:
          oneOf:
            - $ref: "#/components/schemas/ReviewedDieLineSettings"
            - type: "null"
        suggestedDefaults:
          oneOf:
            - $ref: "#/components/schemas/ReviewedDieLineSettings"
            - type: "null"
    RunDieType:
      $ref: "#/components/schemas/ReviewedDieDefault"
    DieDefaultSaveRequest:
      type: object
      additionalProperties: false
      required: [requestId, dieCode, expectedRevision, defaults, enabled]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 200
        dieCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        defaults:
          $ref: "#/components/schemas/ReviewedDieLineSettings"
        enabled:
          type: boolean
    DieDefaultSaveResult:
      type: object
      required: [outcome, dieCode, revision, status, defaults, replayed]
      properties:
        outcome:
          type: string
          enum: [created, updated, retired, re-enabled]
        dieCode:
          type: string
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, disabled]
        defaults:
          $ref: "#/components/schemas/ReviewedDieLineSettings"
        replayed:
          type: boolean
    DieDefaultHistoryItem:
      type: object
      required: [id, dieCode, actorId, action, revision, before, after, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        dieCode:
          type: string
        actorId:
          type: string
          format: uuid
        action:
          type: string
          enum: [created, updated, retired, re-enabled]
        revision:
          type: integer
          minimum: 1
        before:
          oneOf:
            - type: object
            - type: "null"
        after:
          type: object
        occurredAt:
          type: string
          format: date-time
    DoughCapacity:
      type: object
      required: [status, reasons, doughballYield, pizzasPerCase]
      properties:
        status:
          type: string
          enum: [available, unavailable]
        reasons:
          type: array
          items:
            type: string
        doughballYield:
          type: [number, "null"]
          minimum: 0
        pizzasPerCase:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
    RunProduct:
      type: object
      required: [code, name, doughCapacity, productionSetups]
      properties:
        code:
          type: string
        name:
          type: string
        doughCapacity:
          $ref: "#/components/schemas/DoughCapacity"
        productionSetups:
          type: array
          items:
            $ref: "#/components/schemas/ProductionSetupOption"
    ProductionSetupOption:
      type: object
      required: [code, name, hasDoughRecipe]
      properties:
        code:
          type: string
        name:
          type: string
        hasDoughRecipe:
          type: boolean
    ProductionWarehouse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProductionPlanLine:
      type: object
      required: [productId, productCode, productName, unit, quantity]
      properties:
        productId:
          type: string
          format: uuid
        productCode:
          type: string
        productName:
          type: string
        unit:
          type: string
        quantity:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,6})?$"
    ProductionRecipeSnapshot:
      type: object
      required: [code, name, stationKey, ingredients]
      properties:
        code:
          type: string
        name:
          type: string
        stationKey:
          type: string
          enum: [dough, cheese, pepperoni, sauce, frontline]
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductionPlanLine"
    ProductionPlanSnapshot:
      type: object
      required: [code, name, warehouse, recipes, packagingPerCase]
      properties:
        code:
          type: string
        name:
          type: string
        warehouse:
          $ref: "#/components/schemas/ProductionWarehouse"
        recipes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductionRecipeSnapshot"
        packagingPerCase:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductionPlanLine"
    EffectiveProductionRecipeSnapshot:
      type: object
      required: [code, name, stationKey, ingredients]
      properties:
        code:
          type: string
        name:
          type: string
        stationKey:
          type: string
          enum: [dough, cheese, pepperoni, sauce, frontline]
        ingredients:
          type: array
          minItems: 0
          description: Effective rows after dated swap, add, and remove rules; may be empty after removals.
          items:
            $ref: "#/components/schemas/ProductionPlanLine"
    EffectiveProductionPlanSnapshot:
      type: object
      required: [code, name, warehouse, recipes, packagingPerCase]
      properties:
        code:
          type: string
        name:
          type: string
        warehouse:
          $ref: "#/components/schemas/ProductionWarehouse"
        recipes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EffectiveProductionRecipeSnapshot"
        packagingPerCase:
          type: array
          minItems: 1
          description: Packaging remains identical to the immutable setup snapshot.
          items:
            $ref: "#/components/schemas/ProductionPlanLine"
    SubstitutionRule:
      type: object
      additionalProperties: false
      required: [id, ingredient, action]
      properties:
        id:
          type: string
          format: uuid
        ingredient:
          type: string
          minLength: 1
          maxLength: 120
        action:
          type: string
          enum: [swap, add, remove]
        substituteProductId:
          type: string
          format: uuid
        substituteProductCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        substituteProductName:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: string
          pattern: "^(0|[1-9][0-9]{0,13})(\\.[0-9]{1,6})?$"
          description: Required for add; optional for swap; omitted for remove. Swap without quantity preserves each original row quantity.
    SubstitutionOverlay:
      type: object
      additionalProperties: false
      required: [productionDate, revision, rules, updatedAt]
      properties:
        productionDate:
          type: string
          format: date
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        rules:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SubstitutionRule"
        updatedAt:
          type: [string, "null"]
          format: date-time
    SubstitutionProduct:
      type: object
      additionalProperties: false
      required: [productId, productCode, productName, baseUnit]
      properties:
        productId:
          type: string
          format: uuid
        productCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        productName:
          type: string
          minLength: 1
          maxLength: 120
        baseUnit:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9._/-]{0,15}$"
    SubstitutionRuleInput:
      type: object
      additionalProperties: false
      required: [id, ingredient, action, substituteProductId, quantity]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: Null creates a rule; an existing stable ID updates it. Case-insensitive ingredient upsert retains the existing ID.
