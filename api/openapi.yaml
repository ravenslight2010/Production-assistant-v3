      additionalProperties: false
      required: [outcome, replayed, target, targets]
      properties:
        outcome:
          const: accepted
        replayed:
          type: boolean
        target:
          $ref: "#/components/schemas/QcTarget"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/QcTarget"
    QcTargetConflict:
      type: object
      additionalProperties: false
      required: [outcome, replayed, targets]
      properties:
        outcome:
          const: conflict
        replayed:
          type: boolean
        targets:
          type: array
          items:
            $ref: "#/components/schemas/QcTarget"
    QcTargetSaveResult:
      oneOf:
        - $ref: "#/components/schemas/QcTargetSaveAccepted"
        - $ref: "#/components/schemas/QcTargetConflict"
        - $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable caller-safe account failure code, when available.
        replayed:
          type: boolean
        currentStaff:
          $ref: "#/components/schemas/StaffAccount"
        currentInvitation:
          $ref: "#/components/schemas/StaffInvitation"
        currentRequest:
          $ref: "#/components/schemas/PasswordResetRequest"
        invitation:
          $ref: "#/components/schemas/StaffInvitation"
        request:
          $ref: "#/components/schemas/PasswordResetRequest"
  responses:
    Error:
      description: Safe error message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
