          format: uuid
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        appliedAt:
          type: [string, "null"]
          format: date-time
        appliedBy:
          type: [string, "null"]
          format: uuid
