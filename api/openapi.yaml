    Run:
      type: object
      description: >
        Server-owned run snapshot. Optional productionRules contains enabled
        manager-imported rule assessments. Unknown is not a pass. Flexible
        findings warn; strict unknown/violated findings block preparation/start.
        A bypass can only come from the reviewed imported rule configuration.
      required:
        - id
        - status
        - productionDate
        - revision
        - createdAt
        - updatedAt
        - startedAt
        - pausedAt
        - resumedAt
        - completedAt
        - serverNow
        - runToTime
        - operationalNotes
        - setupSnapshot
        - effectiveProductionPlan
        - substitutionOverlay
        - doughCapacity
        - inventoryConsumption
        - stoppages
        - pauseIntervals
        - stationProgress
      properties:
        productionRules:
          type: array
          items:
            type: object
            required: [code, name, enforcement, status, sourceImportId]
            properties:
              code:
                type: string
              name:
                type: string
              enforcement:
                type: string
                enum: [flexible, strict]
              status:
                type: string
                enum: [passed, violated, unknown, bypassed]
              sourceImportId:
                type: string
                format: uuid
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [planned, running, paused, completed]
        productionDate:
          type: string
          format: date
          description: Immutable facility production date in America/Chicago.
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        pausedAt:
          type: [string, "null"]
          format: date-time
        resumedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        serverNow:
          type: string
          format: date-time
        runToTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Server-owned America/Chicago wall-time operator target; not a lifecycle scheduling instruction.
        operationalNotes:
          type: string
          maxLength: 4000
        stoppages:
          type: array
          items:
            $ref: "#/components/schemas/Stoppage"
        setupSnapshot:
          $ref: "#/components/schemas/RunSetup"
        effectiveProductionPlan:
          oneOf:
            - $ref: "#/components/schemas/EffectiveProductionPlanSnapshot"
            - type: "null"
          description: Current effective plan for planned, running, or paused runs; the exact retained completion plan for completed runs.
        substitutionOverlay:
          oneOf:
            - $ref: "#/components/schemas/SubstitutionOverlay"
            - type: "null"
          description: Current dated overlay, or the retained overlay used at completion. Null only for legacy unscoped records.
        doughCapacity:
          $ref: "#/components/schemas/DoughCapacity"
        inventoryConsumption:
          oneOf:
            - $ref: "#/components/schemas/RunInventoryConsumption"
            - type: "null"
        pauseIntervals:
          type: array
          items:
            $ref: "#/components/schemas/PauseInterval"
        stationProgress:
          type: object
          description: Canonical per-station inputs, progress, timer state, and revisions.
          additionalProperties:
            $ref: "#/components/schemas/StationState"
