          type: [object, "null"]
    OpeningCountSummary:
      type: object
      required: [id, warehouseId, warehouseName, status, rowCount, createdBy, reviewedBy, appliedBy, createdAt, reviewedAt, appliedAt]
      properties:
        id:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        warehouseName:
          type: string
        status:
          type: string
          enum: [staged, reviewed, applied]
        rowCount:
          type: integer
          minimum: 1
        createdBy:
          type: string
          format: uuid
        reviewedBy:
          type: [string, "null"]
          format: uuid
        appliedBy:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, "null"]
          format: date-time
        appliedAt:
          type: [string, "null"]
          format: date-time
    OpeningCountResult:
      type: object
      required: [outcome, countId, warehouseId, rowCount, replayed]
      properties:
        outcome:
          type: string
          enum: [reviewed, applied]
        countId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        rowCount:
          type: integer
        replayed:
          type: boolean
    ScheduleProduct:
      type: object
      required: [code, name, productionSetups]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        name:
          type: string
          maxLength: 120
        productionSetups:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code:
                type: string
                pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
              name:
                type: string
                maxLength: 120
    ScheduleRunTemplate:
      type: object
      required: [code, name, brand, flavor, values]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        name:
          type: string
          maxLength: 200
        brand:
          type: [string, "null"]
        flavor:
          type: [string, "null"]
        values:
          type: object
          properties:
            pizzasPerCase:
              type: number
            crustsPerCycle:
              type: number
            cycleSpeed:
              type: number
            speedAdjustment:
              type: number
            freezerTime:
              type: number
    ScheduleCatalog:
      type: object
      required: [products, templates, productionStartTime, timeZone]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleProduct"
        templates:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleRunTemplate"
        productionStartTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        timeZone:
          type: string
          const: America/Chicago
    ScheduleReadinessWarning:
      type: object
      additionalProperties: false
      required: [code, message, setupSection]
      properties:
        code:
          type: string
          enum: [product_unavailable, production_setup_unavailable, run_template_unavailable, recipe_rows_missing, dough_yield_unavailable, case_capacity_unavailable]
        message:
          type: string
          minLength: 1
          maxLength: 240
        setupSection:
          type: string
          enum: [products, production-setups, run-templates, recipes]
    PlannedScheduleRun:
      type: object
      additionalProperties: false
      required: [id, productCode, productionSetupCode, runTemplateCode, targetCases, notes]
      properties:
        id:
          type: string
          format: uuid
        productCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        productionSetupCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        runTemplateCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        targetCases:
          type: integer
          minimum: 1
          maximum: 1000000
        notes:
          type: string
          maxLength: 500
        carriedInCases:
          type: integer
          minimum: 0
          description: Server-derived finished-case carry-in; never accepted as a schedule input.
        effectiveTargetCases:
          type: integer
          minimum: 0
          description: Target cases minus carried-in surplus.
        readinessWarnings:
          type: array
          description: Server-derived advisory diagnostics on confirmed schedule reads; never accepted as schedule command input.
          items:
            $ref: "#/components/schemas/ScheduleReadinessWarning"
    ScheduleBreak:
      type: object
      additionalProperties: false
      required: [slot, enabled, runId]
      properties:
        slot:
          type: integer
          enum: [1, 2, 3]
        enabled:
          type: boolean
        runId:
          type: [string, "null"]
          format: uuid
    ProductionSchedule:
      type: object
      additionalProperties: false
      required: [date, revision, timeZone, productionStartTime, runs, breaks, updatedAt, substitutionOverlay]
      properties:
        date:
          type: [string, "null"]
          format: date
        revision:
          type: integer
          minimum: 0
        timeZone:
          type: string
          const: America/Chicago
        productionStartTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        runs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PlannedScheduleRun"
        breaks:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ScheduleBreak"
        updatedAt:
          type: [string, "null"]
          format: date-time
        substitutionOverlay:
          $ref: "#/components/schemas/SubstitutionOverlay"
    ProductionScheduleCommandRequest:
      type: object
      additionalProperties: false
      required: [requestId, date, expectedRevision, command]
      properties:
        requestId:
          type: string
          format: uuid
        date:
          type: [string, "null"]
          format: date
        expectedRevision:
          type: integer
          minimum: 0
        command:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, run]
              properties:
                type:
                  const: add
                run:
                  $ref: "#/components/schemas/PlannedScheduleRun"
            - type: object
              additionalProperties: false
              required: [type, runId, changes]
              properties:
                type:
                  const: update
                runId:
                  type: string
                  format: uuid
                changes:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    productCode:
                      type: string
                    productionSetupCode:
                      type: string
                    runTemplateCode:
                      type: string
                    targetCases:
                      type: integer
                    notes:
                      type: string
            - type: object
              additionalProperties: false
              required: [type, runId]
              properties:
                type:
                  const: remove
                runId:
                  type: string
                  format: uuid
            - type: object
              additionalProperties: false
              required: [type, runId, toIndex]
              properties:
                type:
                  const: move
                runId:
                  type: string
                  format: uuid
                toIndex:
                  type: integer
                  minimum: 0
                  maximum: 99
            - type: object
              additionalProperties: false
              required: [type, firstRunId, secondRunId]
              properties:
                type:
                  const: swap
                firstRunId:
                  type: string
                  format: uuid
                secondRunId:
                  type: string
                  format: uuid
            - type: object
              additionalProperties: false
              required: [type, breaks]
              properties:
                type:
                  const: breaks
                breaks:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    $ref: "#/components/schemas/ScheduleBreak"
            - type: object
              additionalProperties: false
              required: [type, runs]
              properties:
                type:
                  const: merge-import
                runs:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/PlannedScheduleRun"
    ProductionScheduleCommandResponse:
      type: object
      required: [outcome, replayed, schedule]
      properties:
        outcome:
          type: string
          enum: [accepted, conflict]
        replayed:
          type: boolean
        schedule:
          $ref: "#/components/schemas/ProductionSchedule"
    ScheduleImportSource:
      type: object
      additionalProperties: false
      required: [fileName, sha256, parserVersion]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 160 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        parserVersion: { type: string, const: v1-schedule-import/1 }
    ScheduleImportSourceCitation:
      type: object
      additionalProperties: false
      required: [workbook, sheet, row, cells]
      properties:
        workbook: { type: string, minLength: 1, maxLength: 160 }
        sheet: { type: string, minLength: 1, maxLength: 200 }
        row: { type: integer, minimum: 1, maximum: 20000 }
        cells:
          type: object
          required: [brand, flavor, targetCases]
          properties:
            brand: { type: string }
            flavor: { type: string }
            targetCases: { type: string }
            date: { type: string }
    CanonicalScheduleImportRun:
      allOf:
        - $ref: "#/components/schemas/PlannedScheduleRun"
        - type: object
          required: [date, source]
          properties:
            date: { type: string, format: date }
            source: { $ref: "#/components/schemas/ScheduleImportSourceCitation" }
    ScheduleImportDate:
      type: object
      required: [productionDate, status, createdRunCount, updatedRunCount, appliedAt, undoneAt, undoAvailable]
      properties:
        productionDate: { type: string, format: date }
        status: { type: string, enum: [staged, applied, undone] }
        createdRunCount: { type: integer, minimum: 0, maximum: 100 }
        updatedRunCount: { type: integer, minimum: 0, maximum: 100 }
        appliedAt: { type: [string, "null"], format: date-time }
        undoneAt: { type: [string, "null"], format: date-time }
        undoAvailable: { type: boolean }
    ScheduleImportSummary:
      type: object
      required: [importId, createdAt, source, rowCount, dates]
      properties:
        importId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/ScheduleImportSource" }
        rowCount: { type: integer, minimum: 1, maximum: 2000 }
        dates:
          type: array
          items: { $ref: "#/components/schemas/ScheduleImportDate" }
    ScheduleImportDetail:
      allOf:
        - $ref: "#/components/schemas/ScheduleImportSummary"
        - type: object
          required: [runs]
          properties:
            runs:
              type: array
              minItems: 1
              maxItems: 2000
              items: { $ref: "#/components/schemas/CanonicalScheduleImportRun" }
    ScheduleImportListResponse:
      type: object
      required: [imports]
      properties:
        imports:
          type: array
          items: { $ref: "#/components/schemas/ScheduleImportSummary" }
    ScheduleImportDetailResponse:
      type: object
      required: [import]
      properties:
        import: { $ref: "#/components/schemas/ScheduleImportDetail" }
    ScheduleImportStageRequest:
      type: object
      additionalProperties: false
      required: [importId, requestId, source, runs]
      properties:
        importId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ScheduleImportSource" }
        runs:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/CanonicalScheduleImportRun" }
    ScheduleImportStageResponse:
      type: object
      required: [outcome, replayed, import]
      properties:
        outcome: { type: string, const: staged }
        replayed: { type: boolean }
        import: { $ref: "#/components/schemas/ScheduleImportDetail" }
    ScheduleImportActionRequest:
      type: object
      additionalProperties: false
      required: [requestId, date, expectedRevision]
      properties:
        requestId: { type: string, format: uuid }
        date: { type: string, format: date }
        expectedRevision: { type: integer, minimum: 0 }
    ScheduleImportActionResponse:
      type: object
      required: [outcome, replayed, productionDate, schedule, import]
      properties:
        outcome: { type: string, enum: [accepted, conflict] }
        reason: { type: string, enum: [stale-schedule, created-runs-changed, no-created-runs] }
        replayed: { type: boolean }
        productionDate: { type: string, format: date }
        schedule: { $ref: "#/components/schemas/ProductionSchedule" }
        import: { $ref: "#/components/schemas/ScheduleImportDetail" }
        createdRunCount: { type: integer, minimum: 0, maximum: 100 }
        updatedRunCount: { type: integer, minimum: 0, maximum: 100 }
    ScheduleWorkbookPreviewRequest:
      type: object
      additionalProperties: false
      required: [fileName, workbookBase64]
      properties:
        fileName:
          type: string
          maxLength: 500
        workbookBase64:
          type: string
          maxLength: 6990508
          contentEncoding: base64
    ScheduleWorkbookPreviewResponse:
      type: object
      required: [preview]
      properties:
        preview:
