      properties:
        source:
          type: string
          maxLength: 240
        reason:
          type: string
          maxLength: 300
    SourceWorkbookPreviewRecord:
      type: object
      additionalProperties: false
      required: [source, targetFamily, record]
      properties:
        source:
          type: string
          maxLength: 240
        targetFamily:
          type: string
          enum: [mixes, run-templates]
        record:
          $ref: "#/components/schemas/SetupCatalogRecord"
        sourceDetails:
          type: object
          description: Parsed evidence for manager correction; included rows retain it as canonical source evidence after staging.
          additionalProperties: true
    SourceImportSummary:
      type: object
      additionalProperties: false
      required: [sourceFamily, sourceSha256, parserVersion, sourceRows, importedRows, skippedRows, unresolvedRows]
      properties:
        sourceFamily:
          type: string
          enum: [spec-sheets, premix-sheets, cheese-mix-specs, shipping-guides, sauce-guides, dough-guides]
        sourceSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        parserVersion:
          type: string
          enum: [v1-source-import/1, v1-source-import/2]
          description: New staging requires /2; /1 remains valid for canonical import history.
        sourceRows:
          type: integer
          minimum: 0
          maximum: 2000
          description: Parser-counted physical rows; a row can fan out to flavors or several rows can group into one record.
        importedRows:
          type: integer
          minimum: 1
          maximum: 2000
          description: Reviewed V3 records staged; Apply separately reports created and updated targets.
        skippedRows:
          type: integer
          minimum: 0
          maximum: 2000
          description: Rows or candidates omitted by parser rules or explicitly skipped during review.
        unresolvedRows:
          type: integer
          minimum: 0
          maximum: 2000
          description: Unresolved review-only entries left open after staging.
