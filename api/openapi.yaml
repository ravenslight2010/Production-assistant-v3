            - die-line-defaults
            - production-rules
            - freezer-pull-items
            - run-templates
            - manager-lists
            - aliases
        rowCount:
          type: integer
          minimum: 1
          maximum: 2000
        replayed:
          type: boolean
        records:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/SetupCatalogRecord"
        sourceSummary:
          oneOf:
            - $ref: "#/components/schemas/SourceImportSummary"
            - type: "null"
