              const: weight-check
            details:
              allOf:
                - $ref: "#/components/schemas/QcWeightCheckInput"
                - $ref: "#/components/schemas/QcEvaluation"
    QcBrixCheckRecord:
      allOf:
        - $ref: "#/components/schemas/QcRecordBase"
        - type: object
          required: [kind, details]
          properties:
